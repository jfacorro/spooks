<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Top-down pedestrian, bareheaded and drawn light so Sprite2D.modulate can
       tint each one differently. Faces right (+X), pivot at the canvas center,
       drawn at 2x for a Sprite2D scale of 0.5. A little narrower than the spy so
       the hat and dark coat keep the player's character easy to find. -->
  <g id="shoes" fill="#3a3f46">
    <rect x="76" y="45" width="14" height="10" rx="5"/>
    <rect x="72" y="73" width="14" height="10" rx="5"/>
  </g>
  <rect id="torso" x="46" y="32" width="36" height="64" rx="18" fill="#e6e9ed"/>
  <g id="arms" fill="#cdd2d8">
    <ellipse cx="64" cy="34" rx="14" ry="9"/>
    <ellipse cx="64" cy="94" rx="14" ry="9"/>
  </g>
  <circle id="head" cx="65" cy="64" r="13" fill="#4a4f56"/>
</svg>
