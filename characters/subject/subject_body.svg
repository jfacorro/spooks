<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Top-down subject, upper body: shoulders and arms of the grey overcoat.
       Twists toward a look-back while the legs (subject_legs.svg) keep
       walking. The hat and the briefcase are separate sprites on the same
       canvas so they can move on their own. Faces right (+X), pivot at the
       canvas center, drawn at 2x for a Sprite2D scale of 0.5. -->
  <rect id="torso" x="43" y="27" width="42" height="74" rx="21" fill="#6d7681"/>
  <g id="arms" fill="#5b636d">
    <ellipse cx="64" cy="30" rx="16" ry="10.5"/>
    <ellipse cx="64" cy="98" rx="16" ry="10.5"/>
  </g>
</svg>
